spring:
  application:
    name: job-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5433/job_scheduler
    username: postgres
    password: "0000"

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:///D:/JobScheduler/jwt-public.pem

scheduler:
  worker-id: ${HOSTNAME:worker-local}
  poll-interval-ms: 1000
  poll-batch-size: 20
  executor-pool-size: 8

retry:
  base-delay-ms: 2000
  max-delay-ms: 600000

callback:
  allowed-domains: ${CALLBACK_ALLOWED_DOMAINS:}
  denied-hosts: 169.254.169.254,localhost,127.0.0.1